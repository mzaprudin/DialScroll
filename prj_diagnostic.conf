# USB CDC and logging are present only in explicitly diagnostic builds.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_BT_SECURITY_ERR_TO_STR=y

CONFIG_BLESCROLL_DIAGNOSTIC_MODE=y
CONFIG_BLESCROLL_RUNTIME_DIAGNOSTICS=n
CONFIG_BLESCROLL_DIAGNOSTIC_BLE=n
CONFIG_BLESCROLL_ENCODER_DIAGNOSTICS=y
CONFIG_BLESCROLL_DIAGNOSTIC_START_GATE=n
