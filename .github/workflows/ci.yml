name: Firmware checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.2.4@sha256:397bac78a3e3825ce30443d4cd28c377ea6e5a28910200820967b648d95f88bb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test logic and build five firmware profiles
        run: bash tools/ci.sh
      - name: Upload firmware and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dialscroll-ncs-3.2.4-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/
            twister-out/**/*.json
            twister-out/**/*.xml
            twister-out/**/*.log
