# Core peripherals.
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2C=y

# The product image contains a dormant CDC ACM diagnostic channel. The USB
# device controller is enabled only while VBUS is present, and logging remains
# disabled until the host sends one uppercase D byte.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="AirScroll diagnostics"
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_REBOOT=y
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_BLESCROLL_RUNTIME_DIAGNOSTICS=y

# BLE peripheral and persistent bonding.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_DEVICE_NAME="AirScroll"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=8
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=42
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=5000

# HID over GATT: one encrypted mouse input report.
CONFIG_BT_HIDS=y
CONFIG_BT_BAS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_INPUT_REP_MAX=1
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=28
CONFIG_BT_GATT_CHRC_POOL_SIZE=13
CONFIG_BT_CONN_CTX=y

# Settings use the 32 KiB storage partition below the UF2 bootloader.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# The Adafruit UF2 bootloader on this board starts the application at 0x26000.
# Link the image at that physical address instead of only relocating its UF2
# blocks, otherwise the reset vector still points into the SoftDevice.
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_BASE_ADDRESS=0x26000
CONFIG_FLASH_SIZE=792
CONFIG_FLASH_LOAD_OFFSET=0
CONFIG_FLASH_LOAD_SIZE=0xC6000

# blescroll.uf2 is generated from the linked HEX in CMakeLists.txt.
CONFIG_BUILD_OUTPUT_UF2=n
